name: Publish illustrated guide
on:
  push:
    branches: [master]
    paths: ['site/**', 'scripts/check_site*', 'src/cpp/app/Cfg.cpp', 'cloudflare/utxo-video-worker/src/**', 'README.md', 'AGENTS.md', 'CLAUDE.md', 'GLOSSARY.md', 'docs/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', 'scripts/check_site*', 'src/cpp/app/Cfg.cpp', 'cloudflare/utxo-video-worker/src/**', 'README.md', 'AGENTS.md', 'CLAUDE.md', 'GLOSSARY.md', 'docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/check_site.py
      - run: node --experimental-default-type=module scripts/check_site_mapping.mjs
      - run: node --experimental-default-type=module scripts/check_explorer_navigation.mjs
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
