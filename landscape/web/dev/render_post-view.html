<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>render_post · view harness</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script type="importmap">
{ "imports": {
  "three": "../vendor/three/three.webgpu.js",
  "three/webgpu": "../vendor/three/three.webgpu.js",
  "three/tsl": "../vendor/three/three.tsl.js",
  "three/addons/": "../vendor/three/addons/"
} }
</script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #overlay { position: fixed; left: 8px; top: 8px; z-index: 2; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  #err { position: fixed; left: 8px; bottom: 8px; color: #f88; font: 12px monospace; white-space: pre-wrap; z-index: 3; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="labels"></div>
<div id="overlay"></div>
<div id="err"></div>
<script type="module">
import { startHarness } from './render_post-harness.js';
const params = new URLSearchParams(location.search);
const canvas = document.getElementById('view');
if (params.get('w') && params.get('h')) {
  canvas.style.width = params.get('w') + 'px';
  canvas.style.height = params.get('h') + 'px';
  canvas.style.inset = 'auto';
}
startHarness({ canvas, overlayElement: document.getElementById('overlay'), labelsElement: document.getElementById('labels'), params })
  .catch((e) => { document.getElementById('err').textContent = String(e && e.stack || e); window.__error = String(e && e.stack || e); console.error(e); });
</script>
</body>
</html>
