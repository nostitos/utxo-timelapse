<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>render_terrain dev: real data</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas#view { display: block; width: 100vw; height: 100vh; }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #hud { position: absolute; left: 8px; top: 8px; color: #cfe0ff; font: 12px/1.35 monospace; white-space: pre;
         background: rgba(0,0,0,.45); padding: 6px 8px; border-radius: 4px; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "../vendor/three/three.webgpu.js",
  "three/webgpu": "../vendor/three/three.webgpu.js",
  "three/tsl": "../vendor/three/three.tsl.js",
  "three/addons/": "../vendor/three/addons/"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="labels"></div>
<div id="hud"></div>
<script type="module">
import * as THREE from 'three/webgpu';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { createTerrain } from '../render/terrain/index.js';
import { SCHEMA, PRESETS } from '../settings.schema.js';
import { createSettingsStore } from '../settings.js';
import { createReplayClient } from '../client/replay-client.js';

const q = new URLSearchParams(location.search);
const forceWebGL = q.get('webgl') === '1';
const canvas = document.getElementById('view');
const hud = document.getElementById('hud');
const errors = [];
window.__errors = errors;
window.addEventListener('error', (e) => errors.push(String(e.message)));
window.addEventListener('unhandledrejection', (e) => errors.push(String(e.reason && e.reason.stack || e.reason)));

let requiredLimits;
let requiredFeatures;
if (!forceWebGL && navigator.gpu) {
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  if (adapter) {
    const L = adapter.limits;
    requiredLimits = { maxBufferSize: L.maxBufferSize, maxStorageBufferBindingSize: L.maxStorageBufferBindingSize,
      maxStorageBuffersPerShaderStage: L.maxStorageBuffersPerShaderStage };
    requiredFeatures = adapter.features.has('timestamp-query') ? ['timestamp-query'] : [];
  }
}
const renderer = new THREE.WebGPURenderer({ canvas, antialias: false, forceWebGL, trackTimestamp: q.get('ts') === '1',
  requiredLimits, requiredFeatures });
await renderer.init();
renderer.setPixelRatio(Number(q.get('dpr') || devicePixelRatio));
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.NoToneMapping;
const backend = renderer.backend.isWebGPUBackend ? 'webgpu' : 'webgl2';
const limits = backend === 'webgpu' ? renderer.backend.device.limits : {};
const capabilities = { backend, webgpu: backend === 'webgpu', compute: backend === 'webgpu',
  limits: backend === 'webgpu' ? { maxBufferSize: limits.maxBufferSize, maxStorageBufferBindingSize: limits.maxStorageBufferBindingSize }
    : { maxArrayTextureLayers: renderer.backend.gl.getParameter(renderer.backend.gl.MAX_ARRAY_TEXTURE_LAYERS) } };
const settings = createSettingsStore(SCHEMA, PRESETS, { capabilities, storage: null });
settings.applyPreset(q.get('preset') || 'High');
for (const kv of (q.get('set') || '').split(';').filter(Boolean)) {
  const i = kv.indexOf(':');
  const id = kv.slice(0, i);
  let v = kv.slice(i + 1);
  if (v === 'true') v = true; else if (v === 'false') v = false; else if (v !== '' && !isNaN(Number(v))) v = Number(v);
  settings.set(id, v);
}

const replay = await createReplayClient({ dataUrl: q.get('data') || '/dataset/', maxResidentTiles: settings.get('geo.tileBudget') });
const { manifest, rows, blocktimes } = replay;
const measure = settings.get('amp.measure');
const cmeasure = settings.get('color.measure');
replay.setMeasures({ height: measure, color: cmeasure === 'height' ? measure : cmeasure });
replay.setHeatHalfLife(settings.get('amp.heatHalfLife'));

const scene = new THREE.Scene();
scene.background = new THREE.Color(q.get('bg') || settings.get('color.background') || '#05070c');
const tipX = manifest.numBlocks / 1000;
const cam = (q.get('cam') || [tipX * 0.9, 45, 290, tipX * 0.8, 0, 120].join(',')).split(',').map(Number);
const orthoHalf = Number(q.get('ortho') || 0);
let camera;
if (orthoHalf > 0) {
  // Straight down (x to the right, z down the screen): every pixel sees one cell top.
  const a = innerWidth / innerHeight;
  camera = new THREE.OrthographicCamera(-orthoHalf * a, orthoHalf * a, orthoHalf, -orthoHalf, 0.1, 5000);
  camera.up.set(0, 0, -1);
  camera.position.set(cam[3], 400, cam[5]);
  camera.lookAt(cam[3], 0, cam[5]);
} else {
  camera = new THREE.PerspectiveCamera(Number(q.get('fov') || 50), innerWidth / innerHeight, 0.05, 5000);
  camera.position.set(cam[0], cam[1], cam[2]);
}
const controls = new OrbitControls(camera, canvas);
controls.target.set(cam[3], cam[4], cam[5]);
controls.update();
const isFilm = settings.preset === 'Film';
if (!isFilm && q.get('lights') !== '0') {
  const sun = new THREE.DirectionalLight(0xffffff, 2.2);
  sun.position.set(-300, 400, 500);
  sun.target.position.set(tipX / 2, 0, 100);
  scene.add(sun, sun.target);
  scene.add(new THREE.HemisphereLight(0x9fb7ff, 0x202018, 0.8));
}

const terrain = createTerrain({ renderer, scene, camera, settings, manifest, rows, blocktimes, capabilities,
  labelsElement: document.getElementById('labels') });
scene.add(terrain.object3d);
let framesIn = 0;
replay.onFrame((f) => { framesIn++; terrain.applyFrame(f); });
replay.onError((e) => errors.push('replay: ' + (e && e.message || e)));

let frames = 0;
let lastT = performance.now();
const fpsHist = [];
const gpu = { render: [], compute: [], cpuUpdate: [] };
window.__gpu = gpu;
const tsOn = q.get('ts') === '1' && backend === 'webgpu';
const startBlock = Number(q.get('block') || Math.min(314000, manifest.tip));
let play = Number(q.get('play') || 0); // blocks per frame
let seekDone = false;
let seekMs = 0;
window.__dev = { THREE, renderer, scene, camera, controls, terrain, settings, replay, backend,
  setPlay(n) { play = n; } };
window.__ready = false;

function frame() {
  const now = performance.now();
  fpsHist.push(now - lastT);
  if (fpsHist.length > 60) fpsHist.shift();
  lastT = now;
  controls.update();
  camera.updateMatrixWorld();
  const tu = performance.now();
  const desired = terrain.update(camera, canvas.clientHeight * renderer.getPixelRatio());
  gpu.cpuUpdate.push(performance.now() - tu);
  if (desired) replay.setTiles(desired);
  if (play && seekDone && replay.block !== null) replay.advance(replay.block + play, { budgetMs: 12 });
  renderer.render(scene, camera);
  if (tsOn) {
    renderer.resolveTimestampsAsync('render').then((ms) => { if (ms !== undefined) gpu.render.push(ms); });
    renderer.resolveTimestampsAsync('compute').then((ms) => { if (ms !== undefined) gpu.compute.push(ms); });
  }
  frames++;
  const s = terrain.stats;
  const ms = fpsHist.reduce((a, b) => a + b, 0) / fpsHist.length;
  hud.textContent = backend + '  ' + (1000 / ms).toFixed(1) + ' fps  preset ' + settings.preset +
    '\ninstances ' + s.instances + '  tiles ' + s.tiles + '  resident ' + s.resident + '  desired ' + s.desired +
    '\ntriangles ' + (s.triangles / 1e6).toFixed(2) + 'M  lod ' + s.lodMs.toFixed(2) + ' ms  frames in ' + framesIn +
    '\nblock ' + replay.block + (replay.busy ? ' (busy)' : '') + '  seek ' + seekMs.toFixed(0) + ' ms  mode ' + JSON.stringify(terrain.mode);
  if (!window.__ready && seekDone && !replay.busy && s.instances > 0 && frames > 5) window.__ready = true;
  requestAnimationFrame(frame);
}
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});
requestAnimationFrame(frame);
// Let the first update choose tiles before seeking.
await new Promise((r) => setTimeout(r, 50));
const t0 = performance.now();
const res = await replay.seek(startBlock);
seekMs = performance.now() - t0;
seekDone = true;
window.__seek = { res, ms: seekMs };
</script>
</body>
</html>
