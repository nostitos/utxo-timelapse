<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc"><title id="title">From Bitcoin Core to the browser</title><desc id="desc">Bitcoin Core feeds the change stream and checkpoint. The stream branches into rendered video and an output history index. Both are published to private Cloudflare R2 and served through a Worker.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#a8d6b3"/></marker></defs><rect width="1200" height="380" fill="#0c1115"/><g fill="none" stroke="#526b60" stroke-width="1.5" marker-end="url(#arrow)"><path d="M197 148H250M442 148H485V75H530M485 148V255H530M748 75H800M748 255H800M998 75H1040V162M998 255H1040V192"/></g><g fill="#141f23" stroke="#364940"><rect x="20" y="103" width="177" height="90" rx="2"/><rect x="250" y="103" width="192" height="90" rx="2"/><rect x="530" y="30" width="218" height="90" rx="2"/><rect x="530" y="210" width="218" height="90" rx="2"/><rect x="800" y="30" width="198" height="90" rx="2"/><rect x="800" y="210" width="198" height="90" rx="2"/><rect x="1030" y="147" width="150" height="75" rx="2"/></g><g font-family="monospace" fill="#eceee5" font-size="17"><text x="39" y="137">Bitcoin Core</text><text x="270" y="137">changes.blk1</text><text x="550" y="63">RGB → FFmpeg</text><text x="550" y="243">UTXO history</text><text x="819" y="64">HLS segments</text><text x="819" y="244">History shards</text><text x="1044" y="178">Worker</text></g><g font-family="monospace" fill="#a1b6ad" font-size="12"><text x="39" y="167">node-local REST</text><text x="270" y="167">+ UTX3 checkpoint</text><text x="550" y="91">4K / 60 fps / HEVC</text><text x="550" y="271">creation · spend · sats</text><text x="819" y="92">10 s fMP4 · R2</text><text x="819" y="272">512 blocks · row index</text><text x="1044" y="202">UI + read APIs</text><text x="22" y="330">01 EXTRACT</text><text x="270" y="330">02 PRESERVE STATE</text><text x="550" y="330">03 RENDER + INDEX</text><text x="819" y="330">04 PUBLISH</text><text x="1044" y="330">05 EXPLORE</text></g><g fill="#a8d6b3"><circle cx="485" cy="148" r="4"/><circle cx="1040" cy="162" r="3"/></g></svg>
