name = "utxo-landscape"
main = "src/index.js"
compatibility_date = "2026-09-04"
workers_dev = true
preview_urls = false

# Hashes the app files into landscape/web/app-hash.txt before each deploy, so the Worker can
# serve them under /app/<hash>/ as immutable (landscape/tools/app-hash.mjs).
[build]
command = "node ../../landscape/tools/app-hash.mjs"

# The static app (landscape/web) is served by Workers Static Assets; the Worker runs first so
# every response gets the security headers. dev/ harness pages are excluded by
# landscape/web/.assetsignore.
[assets]
directory = "../../landscape/web"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"
html_handling = "auto-trailing-slash"

# The dataset and the 2D explorer's history shards live in the explorer's private bucket.
[[r2_buckets]]
binding = "VIDEO_BUCKET"
bucket_name = "utxo-video"

# The maintainer's Umbrel node answers transaction lookups first: its Mempool app, reached through
# the tunnel umbrel-node and the Workers VPC service mempool-node (see "Your own Mempool" in
# cloudflare/utxo-landscape-worker/README.md). Deploying needs a token with Connectivity Directory Bind.
[vars]
MEMPOOL_API = "http://127.0.0.1:3006/api"
# Limits sized for the lab (AGENTS.md, Purpose and priorities); raise them here and deploy.
# Inputs the change log cannot date that are looked up, per transaction (code default 24). Each is
# one subrequest, and this account's plan allows 50 per invocation (a lookup that needed 85
# failed with "Too many subrequests"): 40 leaves room for the lookup's own. On the paid Workers
# plan (1,000 per invocation) set 900; inputs past the limit, or past the plan's, have no age.
TX_LOOKUP_LIMIT = "40"
# Lookups per second and burst, per IP: "rate,burst". TX_RATE covers whole lookups, each of which
# asks mempool.space once; it publishes no limit and answers 429 past it, so this one protects a
# third party. NODE_RATE covers lookups the node answers alone, CELL_RATE the inspector's cells.
TX_RATE = "4,200"
NODE_RATE = "30,600"
CELL_RATE = "30,300"

[[vpc_services]]
binding = "MEMPOOL_NODE"
service_id = "01a1f186-bcb0-7302-b83a-3703c2f3b463"

