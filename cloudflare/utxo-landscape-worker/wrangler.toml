name = "utxo-landscape"
main = "src/index.js"
compatibility_date = "2026-09-04"
workers_dev = true
preview_urls = false

# The static app (landscape/web) is served by Workers Static Assets; the Worker runs first so
# every response gets the security headers. dev/ harness pages are excluded by
# landscape/web/.assetsignore.
[assets]
directory = "../../landscape/web"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"
html_handling = "auto-trailing-slash"

# The dataset and the 2D explorer's history shards live in the explorer's private bucket.
[[r2_buckets]]
binding = "VIDEO_BUCKET"
bucket_name = "utxo-video"

